<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuota Curso - Sala Cuna Mayor B</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="portal-body">

    <header class="main-header">
        <div class="container header-inner">
            <div class="header-left-spacer"></div>
            <div class="logo-area">
                <div class="logo-imgs">
                    <img src="https://api.iconify.design/noto:children-crossing.svg" alt="kids" style="height: 40px; margin-right: 5px;">
                    <img src="https://api.iconify.design/noto:building-construction.svg" alt="blocks" style="height: 35px;">
                </div>
                <div class="logo-text">
                    SALA CUNA <span>MAYOR B</span>
                </div>
            </div>
            <nav class="desktop-nav desktop-nav-right">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Inicio</a>
            </nav>
            <button class="hamburger-public" onclick="openMobileNav()"><i class="fas fa-bars"></i></button>
        </div>
    </header>
    <div id="mobile-nav-overlay" class="mobile-nav-overlay" onclick="closeMobileNav()"></div>
    <div id="mobile-nav" class="mobile-nav">
        <button class="mobile-nav-close" onclick="closeMobileNav()"><i class="fas fa-times"></i></button>
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    </div>

    <main class="page-wrapper">
        <div class="container main-content-area" style="padding-top: 40px;">
            <!-- TABS para elegir vista -->
            <div style="display:flex; gap:10px; margin-bottom:30px; margin-top:30px;">
                <button id="tab-curso" onclick="switchTab('curso')"
                    class="tab-btn tab-btn-active">
                    Cuota Curso
                </button>
                <button id="tab-mensual" onclick="switchTab('mensual')"
                    class="tab-btn">
                    Cuota Mensual
                </button>
            </div>

            <!-- Vista Cuota Curso (Mayo–Diciembre) -->
            <section id="vista-curso" style="margin-bottom: 60px;">
                <h2 class="section-title">CUOTA CURSO</h2>
                <div class="card" style="padding:20px; background:white; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                    <p style="text-align:center; color:var(--p-text-light); margin-bottom:20px; font-size:0.9rem;">
                        Estado de pago de la cuota del curso — Mayo a Diciembre
                    </p>
                    <div class="table-responsive">
                        <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
                            <thead>
                                <tr style="background:#f1f5f9; text-align:center;">
                                    <th style="padding:10px 8px; border-bottom:2px solid #ddd; text-align:left;">Alumno</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">May</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Jun</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Jul</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Ago</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Sep</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Oct</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Nov</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Dic</th>
                                </tr>
                            </thead>
                            <tbody id="historial-curso-table"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- Vista Cuota Mensual (Mar-Dic) -->
            <section id="vista-mensual" style="margin-bottom: 60px; display:none;">
                <h2 class="section-title">CUOTA MENSUAL</h2>
                <div class="card" style="padding:20px; background:white; border-radius:15px; box-shadow:0 4px 15px rgba(0,0,0,0.05);">
                    <p style="text-align:center; color:var(--p-text-light); margin-bottom:20px; font-size:0.9rem;">
                        Estado de pagos mensuales — Marzo a Diciembre
                    </p>
                    <div class="table-responsive">
                        <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
                            <thead>
                                <tr style="background:#f1f5f9; text-align:center;">
                                    <th style="padding:10px 8px; border-bottom:2px solid #ddd; text-align:left;">Alumno</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Mar</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Abr</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">May</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Jun</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Jul</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Ago</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Sep</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Oct</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Nov</th>
                                    <th style="padding:10px 4px; border-bottom:2px solid #ddd;">Dic</th>
                                </tr>
                            </thead>
                            <tbody id="historial-mensual-table"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="modal-preview" class="modal-overlay" onclick="this.style.display='none'">
        <img id="preview-img" src="">
        <div class="close-modal">&times;</div>
    </div>

    <div class="watermark">
        <img src="zaviso-brand-mark.jpg" alt="Logo Zaviso">
        Hecho por <span class="z-brand">Zaviso</span>
    </div>

    <script>
        function openMobileNav() { document.getElementById('mobile-nav').classList.add('open'); document.getElementById('mobile-nav-overlay').classList.add('open'); }
        function closeMobileNav() { document.getElementById('mobile-nav').classList.remove('open'); document.getElementById('mobile-nav-overlay').classList.remove('open'); }
        function switchTab(tab) {
            document.getElementById('vista-curso').style.display = tab === 'curso' ? 'block' : 'none';
            document.getElementById('vista-mensual').style.display = tab === 'mensual' ? 'block' : 'none';
            document.getElementById('tab-curso').classList.toggle('tab-btn-active', tab === 'curso');
            document.getElementById('tab-mensual').classList.toggle('tab-btn-active', tab === 'mensual');
        }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
