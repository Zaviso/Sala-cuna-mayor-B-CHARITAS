<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Padres - Sala Cuna Mayor B</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="portal-body">

    <header class="main-header">
        <div class="container header-inner">
            <div class="header-left-spacer"></div>
            <div class="logo-area">
                <div class="logo-imgs">
                    <img src="https://api.iconify.design/noto:children-crossing.svg" alt="kids" style="height: 40px; margin-right: 5px;">
                    <img src="https://api.iconify.design/noto:building-construction.svg" alt="blocks" style="height: 35px;">
                </div>
                <div class="logo-text">
                    SALA CUNA <span>MAYOR B</span>
                </div>
            </div>
            <nav class="desktop-nav desktop-nav-right">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Inicio</a>
            </nav>
            <button class="hamburger-public" onclick="openMobileNav()"><i class="fas fa-bars"></i></button>
        </div>
    </header>
    <div id="mobile-nav-overlay" class="mobile-nav-overlay" onclick="closeMobileNav()"></div>
    <div id="mobile-nav" class="mobile-nav">
        <button class="mobile-nav-close" onclick="closeMobileNav()"><i class="fas fa-times"></i></button>
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    </div>

    <main class="page-wrapper">
        <div class="container main-content-area" style="padding-top: 40px;">
            <section id="centro-padres">
                <h2 class="section-title">CENTRO DE PADRES</h2>
                <div class="card" style="padding:20px; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                    <p style="text-align:center; color: var(--p-text-light); margin-bottom: 20px; font-size: 0.95rem;">
                        Estado de pago de la cuota mensual — $2.000
                    </p>
                    <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #f1f5f9; text-align: left;">
                                    <th style="padding: 12px 10px; border-bottom: 2px solid #ddd;">Alumno</th>
                                    <th style="padding: 12px 10px; border-bottom: 2px solid #ddd; text-align:center;">Cuota Mensual ($2.000)</th>
                                </tr>
                            </thead>
                            <tbody id="cuota-mensual-table">
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div class="watermark">
        <img src="zaviso-brand-mark.jpg" alt="Logo Zaviso">
        Hecho por <span class="z-brand">Zaviso</span>
    </div>

    <script>
        function openMobileNav() { document.getElementById('mobile-nav').classList.add('open'); document.getElementById('mobile-nav-overlay').classList.add('open'); }
        function closeMobileNav() { document.getElementById('mobile-nav').classList.remove('open'); document.getElementById('mobile-nav-overlay').classList.remove('open'); }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
