<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requerimientos - Sala Cuna Mayor B</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="portal-body">

    <header class="main-header">
        <div class="container header-inner">
            <div class="header-left-spacer"></div>
            <div class="logo-area">
                <div class="logo-imgs">
                    <img src="https://api.iconify.design/noto:children-crossing.svg" alt="kids" style="height: 40px; margin-right: 5px;">
                    <img src="https://api.iconify.design/noto:building-construction.svg" alt="blocks" style="height: 35px;">
                </div>
                <div class="logo-text">
                    SALA CUNA <span>MAYOR B</span>
                </div>
            </div>
            <nav class="desktop-nav desktop-nav-right">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Inicio</a>
            </nav>
            <button class="hamburger-public" onclick="openMobileNav()"><i class="fas fa-bars"></i></button>
        </div>
    </header>
    <div id="mobile-nav-overlay" class="mobile-nav-overlay" onclick="closeMobileNav()"></div>
    <div id="mobile-nav" class="mobile-nav">
        <button class="mobile-nav-close" onclick="closeMobileNav()"><i class="fas fa-times"></i></button>
        <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
    </div>

    <main class="page-wrapper">
        <div class="container main-content-area" style="padding-top: 40px;">
            <section class="teacher-requests" id="requerimientos">
                <h2 class="section-title">REQUERIMIENTOS / SOLICITUD</h2>
                <div id="requests-list" class="requests-grid">
                    <div class="empty-msg">Cargando requerimientos...</div>
                </div>
            </section>

            <section style="margin-top: 50px; margin-bottom: 60px;">
                <h2 class="section-title">DONACIONES</h2>
                <div id="donations-list" class="updates-grid">
                    <p class="empty-msg">No hay donaciones registradas.</p>
                </div>
            </section>

            <section style="margin-top: 50px; margin-bottom: 60px;">
                <h2 class="section-title">PARTICIPACIÓN</h2>
                <div id="participations-list" class="updates-grid">
                    <p class="empty-msg">No hay participaciones registradas.</p>
                </div>
            </section>
        </div>
    </main>

    <div id="modal-preview" class="modal-overlay" onclick="this.style.display='none'">
        <img id="preview-img" src="">
        <div class="close-modal">&times;</div>
    </div>

    <div class="watermark">
        <img src="zaviso-brand-mark.jpg" alt="Logo Zaviso">
        Hecho por <span class="z-brand">Zaviso</span>
    </div>

    <script>
        function openMobileNav() { document.getElementById('mobile-nav').classList.add('open'); document.getElementById('mobile-nav-overlay').classList.add('open'); }
        function closeMobileNav() { document.getElementById('mobile-nav').classList.remove('open'); document.getElementById('mobile-nav-overlay').classList.remove('open'); }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
