<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Privado - Centro de Padres</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: var(--radius-md);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="logo" style="justify-content: center; margin-bottom: 20px;">
            <i class="fas fa-user-lock"></i>
            Acceso Privado
        </div>
        <p style="margin-bottom: 20px; color: var(--p-text-light);">Ingresa tus credenciales de administrador</p>
        
        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label style="font-weight: 700; font-size: 0.9rem;">Nombre de Usuario</label>
                <input type="text" id="username" placeholder="Tu usuario" required style="margin-top:5px; margin-bottom:15px;">
            </div>
            <div class="form-group" style="text-align: left;">
                <label style="font-weight: 700; font-size: 0.9rem;">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required style="margin-top:5px; margin-bottom:15px;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar al Panel</button>
        </form>
        <div id="login-error" style="color: var(--p-red); margin-top: 15px; font-weight: 700; display: none;">
            Credenciales incorrectas
        </div>
        <a href="index.html" style="display: block; margin-top: 20px; color: var(--p-text-light); text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Volver al inicio
        </a>
    </div>

    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDLWLZ4BHGBG-mFWW83ctM5ALWUVfWMW",
            authDomain: "jardin-charitas.firebaseapp.com",
            projectId: "jardin-charitas",
            storageBucket: "jardin-charitas.firebasestorage.app",
            messagingSenderId: "422091278966",
            appId: "1:422091278966:web:5ef29fb7be913f0129b004"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('login-error');

            db.ref('jardin_state/users').once('value', (snapshot) => {
                const users = snapshot.val() || {};
                let foundUser = null;

                // Crear cuenta jonathan si no existe
                if (!Object.values(users).find(u => u.username === 'jonathan')) {
                    const newUsers = {
                        ...users,
                        jonathan: { username: 'jonathan', password: 'jota2026', role: 'Editor', permissions: { all: true } }
                    };
                    db.ref('jardin_state/users').set(newUsers);
                    users.jonathan = newUsers.jonathan;
                }

                // Buscar usuario
                foundUser = Object.values(users).find(u => u.username === user && u.password === pass);

                // Aceptar también "charita 2026" con espacio para admin
                if (!foundUser && user === 'admin' && pass === 'charita 2026') {
                    foundUser = Object.values(users).find(u => u.username === 'admin' && u.password === 'charitas2026');
                }

                if (foundUser) {
                    sessionStorage.setItem('isAdmin', 'true');
                    sessionStorage.setItem('userData', JSON.stringify(foundUser));
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    setTimeout(() => errorMsg.style.display = 'none', 3000);
                }
            });
        });
    </script>
</body>
</html>
